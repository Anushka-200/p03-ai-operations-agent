name: CI
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # Tests that need Postgres skip themselves when it is not running. Phase 6 adds the compose
      # database to CI so the schema tests and 5 mocked scenarios run there too.
      - run: uv run pytest -q
        env:
          PHONE_HASH_KEY: ci-test-key
