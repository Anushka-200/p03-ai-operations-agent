[project]
name = "p03-ai-operations-agent"
version = "0.1.0"
description = "AI operations agent for a home-service business: LangGraph + MCP, code-enforced guardrails"
requires-python = ">=3.12"
# Runtime dependencies are added at the task that first needs them.
dependencies = [
    "apscheduler>=3.11.3",
    "fastapi>=0.143.0",
    "google-auth>=2.61.0",
    "httpx>=0.28.1",
    "langfuse>=4.17.0",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-postgres>=3.1.2",
    "litellm>=1.104.2",
    "mcp>=2.3.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "twilio>=9.11.2",
]

[tool.ruff]
line-length = 110  # SQL and the sentences we send to the model are long on purpose

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# E501 (line length) is off: SQL and the sentences we send to the model are long on purpose.
# The formatter still wraps all code at 110.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # SQL and message strings in tests

[tool.mypy]
python_version = "3.12"
files = ["app"]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
