[project]
name = "p03-ai-operations-agent"
version = "0.1.0"
description = "AI operations agent for a home-service business: LangGraph + MCP, code-enforced guardrails"
requires-python = ">=3.12"
# Runtime dependencies are added at the task that first needs them.
dependencies = [
    "langfuse>=4.17.0",
    "litellm>=1.104.2",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # SQL and message strings in tests

[tool.mypy]
python_version = "3.12"
files = ["app"]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
