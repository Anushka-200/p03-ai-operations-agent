# Local dev services. Ports are bound to 127.0.0.1 only and differ from P01 (5433, 8000, 8501, 5678)
# and P02 (5434, 6380, 8001, 8502). P03: Postgres 5435, API 8003, UI 8503. No Redis in v1 (ADR 005).
services:
  postgres:
    image: postgres:16            # already on this machine; P03 needs no extensions
    environment:
      POSTGRES_USER: postgres     # bootstrap superuser: used only by the init script, never by the app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: p03
      P03_MIGRATOR_PASSWORD: ${P03_MIGRATOR_PASSWORD}
      P03_APP_PASSWORD: ${P03_APP_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    # Small machine shared with P02: cap memory so a runaway query can't starve the laptop.
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d p03"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- the application (docker compose up). One image, three commands. ----
  migrate:                        # runs once: applies the SQL migrations as the migrator role, then exits
    build: .
    command: ["python", "-m", "app.db.migrate"]
    environment: &db_env
      MIGRATOR_DATABASE_URL: postgresql://p03_migrator:${P03_MIGRATOR_PASSWORD}@postgres:5432/p03
      DATABASE_URL: postgresql://p03_app:${P03_APP_PASSWORD}@postgres:5432/p03
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  api:
    build: .
    ports:
      - "127.0.0.1:8003:8003"      # local only: no public URL without the owner's approval
    environment: *db_env
    env_file: .env
    depends_on:
      migrate: {condition: service_completed_successfully}
    mem_limit: 512m   # measured: about 290 MB idle with the model libraries loaded
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8003/health', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 6

  scheduler:                      # follow-up tick, Twilio delivery, CRM sync
    build: .
    command: ["python", "-m", "app.scheduler.main"]
    environment: *db_env
    env_file: .env
    depends_on:
      migrate: {condition: service_completed_successfully}
    mem_limit: 256m

  telegram-bot:                   # optional: needs TELEGRAM_BOT_TOKEN and TELEGRAM_OWNER_ID in .env
    build: .
    command: ["python", "-m", "app.scheduler.telegram_bot"]
    profiles: ["telegram"]
    environment: *db_env
    env_file: .env
    depends_on:
      migrate: {condition: service_completed_successfully}
    mem_limit: 512m   # it loads the agent (LangGraph + LiteLLM), like the API

volumes:
  pgdata:
